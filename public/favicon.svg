<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6ef5"/>
      <stop offset="100%" style="stop-color:#0a4db5"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2979ff"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f0ff"/>
      <stop offset="100%" style="stop-color:#c5d8ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0a3380" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Open book - left cover -->
  <path d="M10 72 Q12 58 50 62 L50 88 Q12 84 10 72 Z" fill="url(#bookGrad)" filter="url(#shadow)"/>
  <!-- Open book - right cover -->
  <path d="M90 72 Q88 58 50 62 L50 88 Q88 84 90 72 Z" fill="#1565c0" filter="url(#shadow)"/>
  <!-- Book spine bottom -->
  <ellipse cx="50" cy="88" rx="3" ry="4" fill="#0d47a1"/>

  <!-- Left pages -->
  <path d="M14 70 Q16 57 50 61 L50 85 Q16 81 14 70 Z" fill="url(#pageGrad)" opacity="0.9"/>
  <!-- Left page shine -->
  <path d="M18 68 Q20 58 48 62 L48 72 Q20 68 18 68 Z" fill="white" opacity="0.4"/>

  <!-- Right pages -->
  <path d="M86 70 Q84 57 50 61 L50 85 Q84 81 86 70 Z" fill="url(#pageGrad)" opacity="0.85"/>
  <!-- Right page shine -->
  <path d="M82 68 Q80 58 52 62 L52 72 Q80 68 82 68 Z" fill="white" opacity="0.3"/>

  <!-- Book highlight lines (left) -->
  <path d="M20 65 Q35 63 49 64" stroke="white" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M20 69 Q35 67 49 68" stroke="white" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M20 73 Q35 71 49 72" stroke="white" stroke-width="0.8" fill="none" opacity="0.3"/>

  <!-- Book highlight lines (right) -->
  <path d="M80 65 Q65 63 51 64" stroke="white" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M80 69 Q65 67 51 68" stroke="white" stroke-width="0.8" fill="none" opacity="0.35"/>

  <!-- Graduation cap board (flat top) -->
  <ellipse cx="50" cy="40" rx="28" ry="7" fill="url(#capGrad)" filter="url(#shadow)"/>
  <!-- Cap shine -->
  <ellipse cx="44" cy="38" rx="12" ry="3" fill="white" opacity="0.25"/>

  <!-- Cap body -->
  <path d="M30 40 Q26 52 50 56 Q74 52 70 40 Z" fill="#1a5fd6"/>
  <!-- Cap body shadow -->
  <path d="M33 44 Q30 52 50 55 Q70 52 67 44 Z" fill="#1050c0" opacity="0.6"/>

  <!-- Cap band -->
  <rect x="29" y="39" width="42" height="5" rx="2" fill="#0d47a1" opacity="0.7"/>

  <!-- Tassel string -->
  <line x1="72" y1="40" x2="76" y2="52" stroke="#90caf9" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tassel bob -->
  <circle cx="76" cy="54" r="3" fill="#64b5f6"/>
  <!-- Tassel threads -->
  <line x1="74" y1="57" x2="73" y2="62" stroke="#90caf9" stroke-width="1" stroke-linecap="round"/>
  <line x1="76" y1="57" x2="76" y2="63" stroke="#90caf9" stroke-width="1" stroke-linecap="round"/>
  <line x1="78" y1="57" x2="79" y2="62" stroke="#90caf9" stroke-width="1" stroke-linecap="round"/>
</svg>
